<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外痛点挖掘专家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; padding: 30px 0; border-bottom: 1px solid #334155; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; font-size: 1.1rem; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .panel { background: #1e293b; border-radius: 12px; padding: 25px; border: 1px solid #334155; }
        textarea { width: 100%; min-height: 150px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 1rem; resize: vertical; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; margin-bottom: 10px; }
        button { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.3s; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .results { margin-top: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #334155; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .score { background: #8b5cf6; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        .section { margin-bottom: 15px 0; }
        .section-title { color: #3b82f6; font-weight: 600; margin-bottom: 8px; }
        .ignore { color: #f59e0b; padding: 20px; border-radius: 8px; background: #1e293b; border: 1px solid #f59e0b; }
        pre { background: #0f172a; padding: 15px; border-radius: 8px; overflow-x: auto; }
        .loading { text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>海外痛点挖掘专家</h1>
            <p class="subtitle">全自动挖掘 Reddit/ProductHunt 原生数据，定义微型软件资产</p>
        </header>

        <div class="controls">
            <div class="panel">
                <h3>手动分析</h3>
                <p style="color: #94a3b8; margin-bottom: 15px;">输入帖子内容进行分析</p>
                <input type="text" id="title" placeholder="帖子标题">
                <textarea id="text" placeholder="帖子正文"></textarea>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;">
                    <input type="number" id="score" placeholder="赞数">
                    <input type="number" id="comments" placeholder="评论数">
                </div>
                <button onclick="analyzeText()">分析痛点</button>
            </div>

            <div class="panel">
                <h3>从 Reddit 抓取</h3>
                <p style="color: #94a3b8; margin-bottom: 15px;">需要配置 Reddit API 密钥</p>
                <input type="text" id="subreddits" placeholder="子版块，逗号分隔" value="programming, SaaS, startups">
                <button onclick="fetchReddit()">抓取并分析</button>
            </div>
        </div>

        <div id="results" class="results"></div>
    </div>

    <script>
        async function analyzeText() {
            const title = document.getElementById('title').value;
            const text = document.getElementById('text').value;
            const score = parseInt(document.getElementById('score').value) || 0;
            const comments = parseInt(document.getElementById('comments').value) || 0;

            if (!text.trim()) {
                alert('请输入帖子内容');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">分析中...</div>';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, text, score, num_comments: comments })
                });
                const data = await response.json();
                displayResults([data]);
            } catch (e) {
                resultsDiv.innerHTML = `<div class="ignore">错误: ${e.message}</div>`;
            }
        }

        async function fetchReddit() {
            const subreddits = document.getElementById('subreddits').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">抓取中...</div>';

            try {
                const response = await fetch(`/api/fetch?subreddits=${encodeURIComponent(subreddits)}`);
                const data = await response.json();
                displayResults(data.data);
            } catch (e) {
                resultsDiv.innerHTML = `<div class="ignore">错误: ${e.message}</div>`;
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = '<div class="ignore">未发现有效痛点</div>';
                return;
            }

            resultsDiv.innerHTML = results.map(result => {
                if (result.status === 'IGNORE') {
                    return `<div class="ignore">【IGNORE】${result.reason}</div>`;
                }
                
                const d = result.data || result;
                return `
                    <div class="card">
                        <div class="card-header">
                            <h2>${d.mvp_definition.product_name}</h2>
                            <span class="score">${d.painpoint_summary.validation_score}</span>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">用户痛点</div>
                            <p>${d.painpoint_summary.user_context}</p>
                            <p style="margin-top: 8px; color: #94a3b8;">触发关键词: ${d.painpoint_summary.trigger_keyword}</p>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">竞品分析</div>
                            <p><strong>现有方案:</strong> ${d.competitor_analysis.current_substitute}</p>
                            <p><strong>缺点:</strong> ${d.competitor_analysis.substitute_flaws}</p>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">MVP 定义</div>
                            <p><strong>核心功能:</strong> ${d.mvp_definition.core_feature_only}</p>
                            <p><strong>技术栈:</strong> ${d.mvp_definition.tech_stack_suggestion}</p>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">变现方案</div>
                            <p><strong>定价:</strong> ${d.monetization_route.pricing_strategy}</p>
                            <p><strong>引流钩子:</strong> ${d.monetization_route.traffic_hook}</p>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">JSON 输出</div>
                            <pre>${JSON.stringify(d, null, 2)}</pre>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
