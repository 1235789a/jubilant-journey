name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python -m json.tool config/platforms.json >/dev/null
      - run: python -m json.tool config/verticals.json >/dev/null
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: node --check src/distribution_os/dashboard/app.js
