<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LinkLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">PRIVATE · LOCAL ONLY</p>
      <h1>LinkLens</h1>
      <p id="page-title">Loading current page…</p>
      <label for="note">Your note</label>
      <textarea id="note" rows="5" placeholder="Why is this page useful?"></textarea>
      <button id="save" type="button">Save locally</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
