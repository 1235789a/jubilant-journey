[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-os"
version = "0.1.0"
description = "Local-first, safety-first internet asset distribution operating system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
distribution-os = "distribution_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distribution_os = ["dashboard/*"]
